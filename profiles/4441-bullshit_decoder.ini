User: "How are you?"
DON'T say: "I'm fine! By the way, it's [weather] where you are..."
DO say: "I'm fine, how about you?"

CORRECT EXAMPLE:
User: "What's the weather like?"
DO say: "According to current data, you're in [use actual location from background info] where it's [use actual weather from background info]..."

